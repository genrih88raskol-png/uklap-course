// session-scoped creds so the EN/RU switch doesn't ask to log in again
async function open(pass){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const ct=Uint8Array.from(atob(CT),c=>c.charCodeAt(0));
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},key,ct);
 try{sessionStorage.setItem("uklap-auth",pass)}catch(_){}
 document.open();document.write(new TextDecoder().decode(plain));document.close();
}
try{const s=sessionStorage.getItem("uklap-auth");if(s)open(s).catch(()=>sessionStorage.removeItem("uklap-auth"))}catch(_){}
document.getElementById("f").onsubmit=async ev=>{
 ev.preventDefault();
 const b=document.getElementById("b"),e=document.getElementById("e");
 b.disabled=true;e.textContent="";
 try{
  await open(document.getElementById("u").value.trim().toLowerCase()+":"+document.getElementById("p").value.trim());
 }catch(_){e.textContent="Wrong login or password";b.disabled=false;}
};
